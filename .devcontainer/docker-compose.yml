services:
  app:
    build:
      context: .          # Build context is the current directory.
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached  # Mounts the project folder into the container.

    # Keeps the container running so VS Code can attach to it.
    command: sleep infinity

    # Shares the database container's network. This is why PHP connects
    # to the database at 127.0.0.1 (not "db" and not "localhost" socket).
    network_mode: service:db

  db:
    # Pinned to the MariaDB LTS release so the environment is identical
    # for every student all semester.
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql          # Persist database data.
      - ./db-init:/docker-entrypoint-initdb.d # .sql files here run once, on first creation.
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: web3400
      MYSQL_USER: web3400
      MYSQL_PASSWORD: password

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - 8080:80   # Local Docker: http://localhost:8080. Codespaces uses the forwarded port instead.
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306

volumes:
  mariadb-data:  # Named volume for MariaDB data persistence.
